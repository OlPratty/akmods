---
defaults:
  kernel_flavor: ogc
  version: 44
  akmods_target: aorus

arch-only-x86: &arch-only-x86
  architecture:
    - x86_64

aorus-kmods: &aorus-kmods
  name: aorus-kmods
  description: "Pre-built AORUS laptop kernel modules for Bazzite"
  org: olpratty
  registry: ghcr.io
  repo: aorus-kmods
  transport: docker://

images:
  44:
    ogc:
      aorus:
        !!merge <<:
          - *aorus-kmods
          - *arch-only-x86
