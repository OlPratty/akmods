---
name: Build AORUS OGC kmod

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
  schedule:
    - cron: '25 0 * * *'
  workflow_dispatch:
    inputs:
      ogc_kernel_version:
        description: "Exact OGC kernel release, e.g. 7.1.5-ogc5.1.fc44.x86_64"
        required: false
        default: ""
        type: string

jobs:
  cache_kernel:
    name: Cache OGC kernel (44)
    uses: ./.github/workflows/reusable-cache-kernel.yml
    secrets: inherit
    permissions:
      actions: read
      contents: read
      packages: write
    with:
      architecture: '["x86_64"]'
      kernel_flavor: ogc
      version: 44
      ogc_kernel_version: ${{ inputs.ogc_kernel_version || '' }}

  build_aorus:
    name: Build AORUS kmod
    uses: ./.github/workflows/reusable-build.yml
    secrets: inherit
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    needs: cache_kernel
    with:
      akmods_target: aorus
      architecture: '["x86_64"]'
      kernel_cache_key: ${{ needs.cache_kernel.outputs.KCKEY }}
      kernel_flavor: ogc
      version: 44

  check:
    name: Check AORUS build
    runs-on: ubuntu-24.04
    needs: build_aorus
    if: always()
    steps:
      - name: Fail if AORUS build failed
        if: needs.build_aorus.result != 'success'
        run: exit 1
